<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Google Doc Radar — Settings</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; color: #333; }
h1 { font-size: 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
h1 img { width: 28px; height: 28px; }
.field { margin-bottom: 16px; }
label { display: block; font-weight: 500; margin-bottom: 4px; }
input[type="text"] { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
.hint { font-size: 12px; color: #888; margin-top: 3px; }
.checkbox-row { display: flex; align-items: center; gap: 8px; }
button { padding: 10px 24px; border: none; border-radius: 6px; background: #4285f4; color: #fff; font-size: 14px; cursor: pointer; }
button:hover { background: #3367d6; }
.saved { color: #34a853; font-size: 13px; margin-left: 10px; display: none; }
</style>
</head>
<body>
<h1><img src="icons/icon-48.png" alt=""> Google Doc Radar Settings</h1>

<div class="field">
  <label for="serverUrl">Server URL</label>
  <input type="text" id="serverUrl" placeholder="http://localhost:9902">
  <div class="hint">The google-doc-radar server endpoint</div>
</div>

<div class="field">
  <label for="ttlDays">Cache TTL (days)</label>
  <input type="number" id="ttlDays" min="0" step="1" placeholder="7">
  <div class="hint">Skip re-fetching a doc if it was synced within this many days. Set to 0 to always fetch.</div>
</div>

<div class="field">
  <div class="checkbox-row">
    <input type="checkbox" id="dryRun">
    <label for="dryRun">Dry run (log only, don't send to server)</label>
  </div>
</div>

<button id="saveBtn">Save</button>
<span class="saved" id="savedMsg">✓ Saved</span>

<script src="options.js"></script>
</body>
</html>
