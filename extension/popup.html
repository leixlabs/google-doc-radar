<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; color: #333; padding: 12px; }
h1 { font-size: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
h1 img { width: 20px; height: 20px; }
.status { background: #f8f9fa; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
.status-row { display: flex; justify-content: space-between; padding: 3px 0; }
.label { color: #666; }
.value { font-weight: 500; }
.ok { color: #34a853; }
.err { color: #ea4335; }
.muted { color: #999; font-size: 11px; }
button { width: 100%; padding: 8px; border: none; border-radius: 6px; background: #4285f4; color: #fff; font-size: 13px; cursor: pointer; }
button:hover { background: #3367d6; }
button:disabled { background: #ccc; cursor: default; }
.footer { margin-top: 8px; text-align: right; }
.footer a { font-size: 11px; color: #888; text-decoration: none; cursor: pointer; }
.footer a:hover { color: #4285f4; }
</style>
</head>
<body>
<h1><img src="icons/icon-48.png" alt=""> Google Doc Radar</h1>
<div class="status" id="status">
  <div class="muted">No sync yet</div>
</div>
<button id="extractBtn">Extract Current Tab</button>
<div class="footer"><a id="settingsLink">Settings ⚙</a></div>
<script src="popup.js"></script>
</body>
</html>
